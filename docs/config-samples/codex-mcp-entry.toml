# 推荐先运行 scripts/setup.mjs mcp-config --data-dir <实际数据目录> --format codex
# 以下占位路径须全部替换；与已有配置合并，只维护projectorch这一项，不覆盖其他服务器。
# stdio桥读取本机ProjectOrch发现文件，不手抄端口/令牌；不读取Harness认证。
[mcp_servers.projectorch]
command = "C:/实际ProjectOrch安装目录/runtime/node.exe"
args = ["C:/实际ProjectOrch安装目录/scripts/mcp-control-bridge.mjs", "--data-dir", "C:/实际ProjectOrch数据目录"]
# 配置后在实际控制聊天调用projectorch_identity确认加载；不自动绑定为受管负责人。
